[build]
  publish = "."

[[redirects]]
  from = "https://docs.torchylabs.xyz/"
  to = "/docs.html"
  status = 200
  force = true

[[redirects]]
  from = "https://docs.torchylabs.xyz/*"
  to = "/docs.html"
  status = 200
  force = true

[[redirects]]
  from = "http://docs.torchylabs.xyz/"
  to = "/docs.html"
  status = 200
  force = true

[[redirects]]
  from = "http://docs.torchylabs.xyz/*"
  to = "/docs.html"
  status = 200
  force = true

[[redirects]]
  from = "/docs"
  to = "/docs.html"
  status = 200
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/docs.html"
  status = 200
  force = true
